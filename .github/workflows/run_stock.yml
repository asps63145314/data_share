name: Run Stock Data Script & Save to Folder

on:
  schedule:
    # 台灣時間 每週二、四、六 早上 10:00 (對應 UTC 凌晨 2 點)
    - cron: '0 2 * * 2,4,6'
  workflow_dispatch: # 支援隨時手動點擊按鈕執行

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl

      - name: Run script
        run: |
          python main.py

      - name: Commit and push generated Excel files to folder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add StockShateWeek/*.xlsx
          git commit -m "Auto-update stock data to StockShateWeek folder [skip ci]" || echo "No changes to commit"
          git push
