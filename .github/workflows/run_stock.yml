name: Run Stock Data Script

on:
  schedule:
    # 台灣時間 每週二、四、六 早上 10:00 (對應 UTC 凌晨 2 點)
    - cron: '0 2 * * 2,4,6'
  workflow_dispatch: # 讓你可以隨時手動點擊按鈕測試執行

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl

      - name: Run script
        run: |
          python main.py

      - name: Upload generated Excel files
        uses: actions/upload-artifact@v4
        with:
          name: stock-data-output
          path: '*.xlsx'
